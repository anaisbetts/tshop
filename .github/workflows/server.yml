name: Server

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: boat
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Void types
        run: bun run prepare:void

      - name: Format, lint, and typecheck
        run: bun run check

      - name: Test
        run: bun run test
