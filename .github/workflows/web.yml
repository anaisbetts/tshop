name: Web demo

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-build:
    name: Analyze and build web
    runs-on: boat
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/fvm/versions
            ~/.pub-cache
          key: ${{ runner.os }}-fvm-${{ hashFiles('client/.fvmrc', 'client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-fvm-

      - name: Install Flutter SDK
        run: fvm install

      - run: ./flutterw pub get
      - run: ./dartw format --set-exit-if-changed .
      - run: ./flutterw analyze --fatal-infos
      - run: ./flutterw test
      - run: ./flutterw build web --no-wasm-dry-run
