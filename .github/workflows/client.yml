name: Client

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-build:
    name: Check and build (web + Android)
    runs-on: boat
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/fvm/versions
            ~/.pub-cache
          key: ${{ runner.os }}-fvm-${{ hashFiles('client/.fvmrc', 'client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-fvm-

      - name: Install Flutter SDK
        run: fvm install

      - run: ./flutterw pub get
      - run: ./dartw format --set-exit-if-changed .
      - run: ./flutterw analyze --fatal-infos
      - run: ./flutterw test
      - run: ./flutterw build web --no-wasm-dry-run

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/android/gradle/wrapper/gradle-wrapper.properties', 'client/android/**/*.gradle.kts', 'client/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::notice::Signing secrets unavailable (likely fork PR); building with debug signing."
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./flutterw build apk --release

      - name: Clean up signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tshop-android-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
